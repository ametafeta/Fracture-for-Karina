<header><h1>🦴 Fracture 🌅</h1><div class="sub">Перелом</div><div id="top">Звёздочки: ⭐ <b id="st">0</b></div></header>

<script>
const $=s=>document.querySelector(s);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};

const S=[
["Fracture or break in the bone can result from any injury.","Перелом или трещина в кости может возникнуть из-за любой травмы.","фрЭкчэ ор брэйк ин зэ боун кэн рИзалт фром Эни ИнджЭри"],
["There is a pain, swelling and tenderness and there may be a deformity.","Есть боль, опухоль и болезненность, и может быть деформация.","зэр из э пэйн, суЭлин энд тЭндэнис энд зэр мэй би э дифОмити"],

["A splint can be ready-made or improvised from any stiff material (stick, ruler, magazine and so on).","Шина может быть готовой или сделанной из любого жёсткого материала (палка, линейка, журнал и так далее).","э сплинт кэн би рЭди-мэйд ор Импровайзд фром Эни стиф мэтИриэл (стик, рУлэ, мэгэзИн энд соу он)"],
["The splint should be wider than the limb being splinted, and long enough to prevent movements of the joints near the fracture.","Шина должна быть шире конечности, которую фиксируют, и достаточно длинной, чтобы предотвратить движения суставов возле перелома.","зэ сплинт шуд би уАйдэ зэн зэ лим бИин сплИнтид, энд лон инАф ту привЭнт мУвментс ов зэ джойнтс нИэ зэ фрЭкчэ"],
["Bind the splint in place above and below the fracture.","Привяжи шину на месте выше и ниже перелома.","байнд зэ сплинт ин плэйс эбАв энд билОу зэ фрЭкчэ"],
["If the person has a compound fracture you must take some sterile gauze, put it over the wound and take the patient to the hospital immediately.","Если у человека сложный (открытый) перелом, нужно взять стерильную марлю, положить на рану и сразу отвезти пациента в больницу.","иф зэ пЁрсн хэз э кОмпаунд фрЭкчэ ю маст тэйк сам стЭрайл гоз, пут ит Оува зэ уунд энд тэйк зэ пЭйшент ту зэ хОспитл имИдиэтли"],
["A compound fracture is more serious, in which broken bone has pierced the skin.","Сложный перелом серьёзнее: сломанная кость проткнула кожу.","э кОмпаунд фрЭкчэ из мор сИриэс, ин уИч брОукн боун хэз пиэст зэ скин"]];

const Q1=[0,3,4,7,9].map(tr);
const Q2=[
{q:"Fracture or break in the ___ can result from any injury.",ru:"Перелом или трещина в кости может возникнуть из-за любой травмы.",o:["bone","skin","pain"],a:0},
{q:"Bind the splint in place ___ and below the fracture.",ru:"Привяжи шину на месте выше и ниже перелома.",o:["stiff","above","limb"],a:1},
{q:"The injured part can be immobilized with a ___.",ru:"Повреждённую часть можно обездвижить шиной.",o:["gauze","joint","splint"],a:2},
{q:"Put sterile ___ over the wound.",ru:"Положи стерильную марлю на рану.",o:["gauze","bone","swelling"],a:0},

{q:"An X-ray is never necessary.",ru:"Рентген никогда не нужен.",o:TF,a:1},

const QL=[...[2,3,8,11,17,18].map(wl),...[7,4,2].map(sl)];

{q:"The injured part can be ___ with a splint.",ru:"Повреждённую часть можно обездвижить шиной.",o:["immobilized","pierced","confirmed"],a:0},
{q:"Что значит <b>joint</b>?",o:["марля","сустав","кость"],a:1},
{q:"A splint should be narrower than the limb.",ru:"Шина должна быть уже конечности.",o:TF,a:1},
tr(8),
{q:"Открытый перелом: что сделать с раной?",o:["Привязать шину только ниже","Ничего не делать","Положить стерильную марлю"],a:2,f:"Put sterile gauze over the wound. 🩹"},
{q:"Что значит <b>pierce</b>?",o:["ломать","пронзать","привязывать"],a:1},
{q:"Что значит <b>stiff</b>?",o:["мягкий","стерильный","жёсткий"],a:2},

function text(){M.append(E("h2","","1. Читаем по предложениям 📖"),E("p","sub","Нажми 🔊 и послушай. Читай русскими буквами, ударение — большая буква."));
S.forEach((s,i)=>{const c=E("div","card");c.innerHTML=`<div class="row"><div><div class="en">${i+1}. ${s[0]}</div><div class="pr">[ ${s[2]} ]</div><div class="ru">${s[1]}</div></div><button class="sp">🔊</button></div>`;c.querySelector("button").onclick=()=>say(s[0]);M.append(c)})}

function cards(){M.append(E("h2","","2. Карточки слов 🃏"),E("p","sub","Нажми на карточку: увидишь перевод и как читать."));
const g=E("div","grid");W.forEach(w=>{const fr=`<div style="font-size:26px">${w[3]}</div><div class="en">${w[0]}</div>`,b=E("button","fc",fr);let f=0;b.onclick=()=>{f=!f;b.classList.toggle("f",f);b.innerHTML=f?`<div class="ru"><b>${w[1]}</b></div><div class="pr">[ ${w[2]} ]</div>`:fr;if(f)say(w[0])};g.append(b)});M.append(g)}

function match(){M.append(E("h2","","3. Найди пару 🔗"),E("p","sub","Сначала слово слева, потом перевод справа."));
const P=[0,2,3,4,8,11,13,17].map(i=>W[i]),box=E("div","grid"),c1=E("div","mt"),c2=E("div","mt");let sel=null,left=P.length;
c1.style.display=c2.style.display="grid";c1.style.gridTemplateColumns=c2.style.gridTemplateColumns="1fr";c1.style.gap=c2.style.gap="6px";
sh(P).forEach(p=>{const b=E("button","",`${p[3]} ${p[0]}`);b.onclick=()=>{[...c1.children].forEach(x=>x.classList.remove("sel"));if(b.classList.contains("ok"))return;sel={p,b};b.classList.add("sel")};c1.append(b)});
sh(P).forEach(p=>{const b=E("button","",p[1]);b.onclick=()=>{if(!sel||b.classList.contains("ok"))return;if(sel.p===p){sel.b.classList.remove("sel");sel.b.classList.add("ok");b.classList.add("ok");sel=null;win();if(!--left)M.append(E("div","big","🎉 Все пары найдены!"))}else{b.classList.add("bad","shake");setTimeout(()=>b.classList.remove("bad","shake"),400)}};c2.append(b)});

function mc(items,title,sub,lives){
M.append(E("h2","",title),E("p","sub",sub));let i=0,ok=0,L=lives||0;const hud=E("div"),box=E("div");M.append(hud,box);
const go=()=>{box.innerHTML="";
if(lives)hud.innerHTML=`<div>${"❤️".repeat(L)}${"🖤".repeat(3-L)} &nbsp; 🐲 Босс Перелом</div><div class="bar"><i style="width:${(items.length-ok)/items.length*100}%"></i></div>`;
const again=()=>{const r=E("button","go","Ещё раз 🔄");r.onclick=()=>show(cur);box.append(r)};
if(lives&&L==0){box.append(E("div","big","🐲 Босс победил... Попробуй ещё раз! 💪"));again();return}
if(i>=items.length){box.append(E("div","big",lives?"🎉🐲💥 Ты победила босса! Ты настоящая медсестра! 🩺":(ok==items.length?"🎉 Супер! Всё верно!":`🌸 Готово: ${ok} из ${items.length}`)));again();if(lives)win(5);return}
const it=items[i],c=E("div","card");c.append(E("div","en",`${i+1}/${items.length}. ${it.say?"🎧 ":""}${it.q}`));if(it.ru)c.append(E("div","ru",it.ru));
if(it.say){const b=E("button","go","🔊 Слушать");b.onclick=()=>say(it.say,it.slow);c.append(b);setTimeout(()=>say(it.say,it.slow),300)}
const info=E("div","msg");let done=0;
sh(it.o.map((t,k)=>[t,k==it.a])).forEach(([t,r])=>{const b=E("button","opt",t);b.onclick=()=>{if(done)return;
if(r){done=1;ok++;win();b.classList.add("ok");info.innerHTML="✅ Верно! "+(it.f||"")+`<br><button class="go">Дальше ➡️</button>`}
else{b.classList.add("bad","shake");if(lives||it.say){if(lives)L--;done=1;info.innerHTML=`💔 Мимо! Верно: <b>${it.o[it.a]}</b> ${it.f?"<br>"+it.f:""}<br><button class="go">Дальше ➡️</button>`;[...c.querySelectorAll(".opt")].forEach(x=>{if(x.textContent==it.o[it.a])x.classList.add("ok")})}else info.textContent="🙈 Попробуй ещё"}
if(done){i++;info.querySelector("button").onclick=go}};c.append(b)});c.append(info);box.append(c)};go()}

[["перелом","fracture","🦴"],["кость","bone","🦴"],["боль","pain","😣"],["шина","splint","🪵"],["марля","gauze","🩹"],["сустав","joint","🔗"]].forEach(([ru,en,em])=>{
const c=E("div","card row");c.innerHTML=`<div>${em} <b>${ru}</b></div><div><input placeholder="${en[0]}…" autocapitalize="off" autocomplete="off"> <button class="sp">✔️</button></div>`;

[S[2],S[4],S[7],ST[3]].forEach(([en,ru])=>{const ws=en.split(" "),pool=sh(ws.map(t=>({t}))),c=E("div","card"),ans=E("div","ans"),bank=E("div"),msg=E("div","msg");let cu=[];

if(cu.length==ws.length){const ok=cu.map(w=>w.t).join(" ")==en;msg.textContent=ok?"✅ Верно!":"🙈 Попробуй ещё";if(ok&&!c.d){c.d=1;win()}}else msg.textContent=""};
c.append(E("div","ru","🇷🇺 "+ru),ans,bank,msg);draw();M.append(c)})}
